name: Otimizar imagens WebP
on:
  push:
    paths:
      - '.github/workflows/otimizar-imagens.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Converter cinco imagens e atualizar referências
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          arquivos = [
              'times-historicos/Torneio_beneficente_Stefany_e_Ranny_2023.jpg',
              'Real_tocantins.png',
              'Ari.jpeg',
              'Milena.png',
              'times-historicos/vice-liga-2023.jpeg',
          ]
          trocas = {}
          for nome in arquivos:
              origem = Path(nome)
              if not origem.is_file():
                  raise FileNotFoundError(f'Imagem original ausente: {nome}')
              destino = origem.with_suffix('.webp')
              with Image.open(origem) as im:
                  im = ImageOps.exif_transpose(im)
                  im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(destino, 'WEBP', quality=82, method=6)
                  with Image.open(destino) as teste:
                      teste.verify()
              trocas[nome] = destino.as_posix()
              print(f'{nome}: {origem.stat().st_size} -> {destino.stat().st_size} bytes')
          for pagina in Path('.').glob('*.html'):
              original = pagina.read_text(encoding='utf-8')
              novo = original
              for antes, depois in trocas.items():
                  novo = novo.replace(antes, depois)
              if novo != original:
                  pagina.write_text(novo, encoding='utf-8')
                  print('Referências atualizadas:', pagina)
          PY
      - name: Publicar imagens convertidas e HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.webp' '*.html' 'times-historicos/*.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Converte cinco imagens pesadas para WebP e atualiza referências"
            git push
          fi
